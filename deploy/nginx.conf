# /etc/nginx/sites-available/formula2026
# domenni yozing, keyin: ln -s ../sites-available/formula2026 /etc/nginx/sites-enabled/ && certbot --nginx -d DOMEN
server {
    listen 80;
    server_name formula2026.example.uz;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
